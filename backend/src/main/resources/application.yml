spring:
  application:
    name: bankease-api
  datasource:
    url: jdbc:mysql://localhost:3306/bankease_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  Jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    cors:
      allowed-origins: http://localhost:4200, http://localhost:3000
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: '*'
      allow-credentials: true

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:your-super-secret-key-change-in-production-minimum-256-bits-long}
  expiration: 86400000

logging:
  level:
    root: INFO
    com.bankease: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs