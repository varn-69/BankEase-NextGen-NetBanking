<div class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <h1 class="h2">My Accounts</h1>
        <button class="btn btn-primary" (click)="showCreateForm = !showCreateForm">
          <i class="fas fa-plus"></i> Create Account
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="alert alert-info">Loading accounts...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <!-- Create Account Form -->
  <div *ngIf="showCreateForm" class="card mb-4">
    <div class="card-header">
      <h5>Create New Account</h5>
    </div>
    <div class="card-body">
      <form [formGroup]="createForm" (ngSubmit)="createAccount()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Account Type</label>
            <select class="form-control" formControlName="accountType">
              <option *ngFor="let type of accountTypes" [value]="type">{{ type }}</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Initial Balance</label>
            <input type="number" class="form-control" formControlName="initialBalance" placeholder="0">
          </div>
        </div>
        <button type="submit" class="btn btn-success" [disabled]="!createForm.valid">
          Create Account
        </button>
        <button type="button" class="btn btn-secondary ms-2" (click)="showCreateForm = false">
          Cancel
        </button>
      </form>
    </div>
  </div>

  <!-- Accounts List -->
  <div *ngIf="!loading && accounts.length > 0" class="row">
    <div *ngFor="let account of accounts" class="col-md-6 col-lg-4 mb-4">
      <div class="card account-card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h5 class="card-title">{{ account.accountType }}</h5>
              <p class="card-text text-muted">{{ account.accountNumber }}</p>
            </div>
            <span class="badge" [ngClass]="account.status === 'ACTIVE' ? 'bg-success' : 'bg-warning'">
              {{ account.status }}
            </span>
          </div>
          <hr>
          <p class="h4 text-primary mb-0">₹{{ account.balance | number:'1.2-2' }}</p>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && accounts.length === 0" class="alert alert-info">
    No accounts found. Create your first account!
  </div>
</div>
